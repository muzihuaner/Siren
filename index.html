<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>警报器模拟器</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>警报器模拟器</h1>
        </div>
        <div class="controls">
            <button id="muteButton" class="mute-button">
                <span class="mute-icon">🔊</span>
            </button>
        </div>

        <div class="sirens-grid">
            <div class="siren-item" data-sound="alarm.mp3">
                <div class="light air-raid"></div>
                <p>防空警报</p>
            </div>

            <div class="siren-item" data-sound="ambulance.mp3">
                <div class="light ambulance"></div>
                <p>救护车警报</p>
            </div>

            <div class="siren-item" data-sound="fire.mp3">
                <div class="light fire-truck"></div>
                <p>消防车警报</p>
            </div>

            <div class="siren-item" data-sound="police1.mp3">
                <div class="light police1"></div>
                <p>警车警报1</p>
            </div>

            <div class="siren-item" data-sound="police2.mp3">
                <div class="light police2"></div>
                <p>警车警报2</p>
            </div>

            <div class="siren-item" data-sound="warning.mp3">
                <div class="light warning"></div>
                <p>路边警告灯</p>
            </div>

            <div class="siren-item" >
                <div class="light police1"></div>
                 <a href="jb.html" style="color: aliceblue;">手机警报器(点击进入)</a>
            </div>

        </div>
        <div>
           
        </div>

        <div class="footer">
            <p> 本软件仅供娱乐与技术学习，严禁在道路、商场、公园、居民区等公共场所播放，严禁用于冒充特种车辆等违法行为，违者后果自负。！</p>

        </div>
    </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
